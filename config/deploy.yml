# Name of this app
service: fizzy
image: fizzy


#-- About your deployment --#

# Where to deploy fizzy
servers:
  web:
    - 46.224.17.255

# How you connect to your server
ssh:
  user: root
  keys:
    - ~/.ssh/id_rsa_hetzner

# Caddy handles SSL externally, kamal-proxy just routes
proxy:
  ssl: false
  host: fizzy.fiumed.cloud
  app_port: 80
  forward_headers: true

# Your application configuration (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - SMTP_PASSWORD
  clear:
    BASE_URL: https://fizzy.fiumed.cloud
    FROM_EMAIL: ivor.kovic@fiumed.hr
    SMTP_ADDRESS: smtp.gmail.com
    SMTP_PORT: "587"
    SMTP_DOMAIN: fiumed.hr
    SMTP_USER_NAME: ivor.kovic@fiumed.hr
    SMTP_AUTHENTICATION: plain
    SMTP_ENABLE_STARTTLS_AUTO: "true"
    MULTI_TENANT: "false"
    SOLID_QUEUE_IN_PUMA: "true"
    DISABLE_SSL: "true"


#-- General configuration --#

# Use a local registry to deploy
registry:
  server: localhost:5555

# Handy aliases for interacting with your deployment. For eaxmple: `bin/kamal console` will connect to a
# Rails console in production.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# CRITICAL: Use the EXACT volume name from the existing docker-compose setup
volumes:
  - "fizzy_fizzy-storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
